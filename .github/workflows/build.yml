name: Build

# Images are built only when their own folder changed, or when somebody starts this
# workflow by hand. An image is published only under its version, the one line of
# images/<name>/version, and a published version never changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build: the name of a folder under images/. Empty builds every image."
        required: false
        default: ""
        type: string

# Nothing by default. Each job asks for what it needs.
permissions: {}

jobs:
  changed:
    name: Find the images to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
      builds: ${{ steps.list.outputs.builds }}
    steps:
      # The whole history, because the script compares two commits that can be far apart.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test and lint the scripts
        run: |
          for test in scripts/*-test.sh; do
              sh "${test}"
          done
          sh scripts/same-files.sh
          shellcheck --shell=sh -o all scripts/*.sh images/*/*.sh
      # Compared from the point where the branch left the base branch, so that changes
      # made on the base branch since then do not count as this pull request's own.
      - name: Find the fork point
        id: fork
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          point="$(git merge-base "${PR_BASE}" "${PR_HEAD}")"
          echo "point=${point}" >>"${GITHUB_OUTPUT}"
      # A published version never changes, so a changed image needs a greater version, and an
      # image built on another image of this repository needs a version of it that exists.
      # The registry is asked without a login, because the images are public.
      - name: Check the versions of the changed images
        if: github.event_name == 'pull_request'
        env:
          FORK_POINT: ${{ steps.fork.outputs.point }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          sh scripts/check-version-bump.sh "${FORK_POINT}" "${PR_HEAD}"
          sh scripts/check-base-versions.sh "${FORK_POINT}" "${PR_HEAD}"
      - name: List the images
        id: list
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          FORK_POINT: ${{ steps.fork.outputs.point }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUESTED: ${{ inputs.image }}
        run: |
          set -eu
          list="${RUNNER_TEMP}/images.txt"
          case "${EVENT}" in
          push)
              sh scripts/changed-images.sh "${PUSH_BEFORE}" "${PUSH_SHA}" >"${list}"
              ;;
          pull_request)
              sh scripts/changed-images.sh "${FORK_POINT}" "${PR_HEAD}" >"${list}"
              ;;
          workflow_dispatch)
              sh scripts/changed-images.sh --all >"${list}"
              if [ -n "${REQUESTED}" ]; then
                  # The name is looked up in the list of real images instead of being
                  # put into a path, so it cannot point anywhere else.
                  if ! grep -Fxq "${REQUESTED}" "${list}"; then
                      echo "There is no image \"${REQUESTED}\": images/<name>/Dockerfile does not exist." >&2
                      exit 1
                  fi
                  echo "${REQUESTED}" >"${list}"
              fi
              ;;
          *)
              echo "Unexpected event: ${EVENT}" >&2
              exit 1
              ;;
          esac
          images="$(jq -R . <"${list}" | jq -sc .)"
          echo "Images to build: ${images}"
          echo "images=${images}" >>"${GITHUB_OUTPUT}"

          # One entry per image and CPU type, each with the runner of its own type. An
          # image lists its CPU types in images/<name>/arch, and builds for both
          # without that file. The script runs on its own line, so that its failure
          # stops this step.
          objects="${RUNNER_TEMP}/builds.json"
          arches="${RUNNER_TEMP}/arches.txt"
          : >"${objects}"
          while IFS= read -r name; do
              sh scripts/image-arches.sh "${name}" >"${arches}"
              jq -cR --arg image "${name}" '{
                  image: $image,
                  arch: .,
                  runner: ({"amd64": "ubuntu-latest", "arm64": "ubuntu-24.04-arm"}[.])
              }' <"${arches}" >>"${objects}"
          done <"${list}"
          builds="$(jq -sc . <"${objects}")"
          echo "Builds: ${builds}"
          echo "builds=${builds}" >>"${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: changed
    if: needs.changed.outputs.images != '[]'
    # Each CPU type is built on a machine of its own type and the results are joined
    # afterwards. Building arm64 on an amd64 machine would emulate the CPU and take many
    # times longer. The list holds one entry for each CPU type of each image.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      # The full commit in the tag keeps two builds of different commits apart. The
      # architecture in the tag keeps the two halves of one build apart.
      TAG: ghcr.io/splicefs/${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Some images hold a file that must be made by booting a machine, which
      # "docker build" cannot do with hardware help. Their prepare.sh makes the file on
      # the runner, inside images/<name>/, for the Dockerfile to copy.
      - name: Prepare
        run: |
          set -eu
          if [ -x "images/${IMAGE}/prepare.sh" ]; then
              sh "images/${IMAGE}/prepare.sh" "${ARCH}"
          fi
      - name: Build
        run: docker build --build-arg TARGETARCH="${ARCH}" -t "${TAG}" "images/${IMAGE}"
      - name: Smoke test
        run: |
          set -eu
          docker run --rm "${TAG}" uname -m
          # An image can ship its own checks. They run inside the image, from a read-only mount.
          if [ -x "images/${IMAGE}/test.sh" ]; then
              set -- --rm -v "${PWD}/images/${IMAGE}:/t:ro"
              # A check that boots a machine needs the hardware help of the runner to
              # finish in seconds. Not every runner has it.
              if [ -e /dev/kvm ]; then
                  set -- "$@" --device /dev/kvm
              fi
              docker run "$@" "${TAG}" sh /t/test.sh
          fi
      # Only the main branch publishes. A pull request is built and tested, nothing more,
      # and a manual run from another branch must not replace the images people pull.
      - name: Push
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${TAG}"

  publish:
    name: Publish ${{ matrix.image }}
    needs: [changed, build]
    if: >-
      needs.changed.outputs.images != '[]' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changed.outputs.images) }}
    # One publish of an image at a time, so that the check of the registry below and the
    # publish that follows it are never split by another run's.
    concurrency:
      group: publish-${{ matrix.image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ matrix.image }}
      COMMIT: ${{ github.sha }}
    steps:
      # The checkout gives the scripts that name the version and the CPU types of the
      # image, at the commit that was built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Join the builds into one image and tag it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/splicefs/${IMAGE}"
          # The image is published under its version and no other name. A published
          # version never changes, so a version that is already there stops this image
          # before anything is published.
          sh scripts/check-unpublished.sh "${IMAGE}"
          version="$(sh scripts/image-version.sh "${IMAGE}")"
          # Only the CPU types that were built for this image are joined. The same file
          # decided what the build job built.
          arches="${RUNNER_TEMP}/arches.txt"
          sh scripts/image-arches.sh "${IMAGE}" >"${arches}"
          set --
          while IFS= read -r arch; do
              set -- "$@" "${repository}:${COMMIT}-${arch}"
          done <"${arches}"
          # One name that gives each machine its own CPU type. It is made from the
          # builds already in the registry, so nothing is built or emulated here.
          docker buildx imagetools create -t "${repository}:${version}" "$@"
          docker buildx imagetools inspect "${repository}:${version}"

  # The branch rule needs one check with a fixed name: the build jobs are named after the
  # images they build, and those differ from one change to the next. This job fails unless
  # finding the images worked and every build passed. No build at all (nothing under images/
  # changed) is a pass.
  result:
    name: All builds
    needs: [changed, build]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every build passed
        env:
          CHANGED: ${{ needs.changed.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "${CHANGED}" != success ]; then
              echo "Finding the images ended with: ${CHANGED}" >&2
              exit 1
          fi
          case "${BUILD}" in
          success | skipped) echo "Every build passed." ;;
          *)
              echo "The builds ended with: ${BUILD}" >&2
              exit 1
              ;;
          esac

  # A failed run of this workflow opens an issue assigned to the account in the repository
  # variable ALERT_ASSIGNEE, so that someone gets an email; GitHub sends none for runs the
  # bots start. Pull requests are left out: their author sees the failed check there.
  alert:
    name: Report a failure
    needs: [changed, build, publish, result]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    permissions:
      issues: write
    uses: SpliceFS/.github/.github/workflows/report-failure-v1.yml@main
    with:
      assignee: ${{ vars.ALERT_ASSIGNEE }}
