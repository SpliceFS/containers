# SonarQube Cloud settings for the analysis that .github/workflows/sonarqube.yml runs. The two
# keys must match the project on sonarcloud.io (it still carries the repository's former name).
sonar.organization=splicefs
sonar.projectKey=SpliceFS_containers

sonar.sources=.

# docker:S6471 flags every image whose last user is root. The owner reviewed it and accepted
# it for every Dockerfile under images/: the server images run the system's service manager
# (systemd or OpenRC) as process 1, which is root on every real server, and they are test
# environments, never run as a service. Images that do not need root (go, rpm-build,
# apk-build) set a non-root USER instead, so the rule still guards them by review.
sonar.issue.ignore.multicriteria=root
sonar.issue.ignore.multicriteria.root.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.root.resourceKey=images/**/Dockerfile
